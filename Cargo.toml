[workspace]
members = [".", "xtask", "crates/icons", "crates/tw_merge/tw_merge", "crates/tw_merge/tw_merge_variants"]
resolver = "2"

[package]
name = "nrz_dashboard"
version = "1.0.1"
edition = "2024"
publish = false
description = "nrzDashboard – Dashboard für umbrelOS (Dioxus fullstack, nrzUI)"

[dependencies]
dioxus = { version = "0.7.10", features = ["router", "fullstack"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
icons = { path = "crates/icons", features = ["dioxus"] }
tw_merge = { path = "crates/tw_merge/tw_merge", features = ["debug"] }
urlencoding = "2"
# Markdown (Agent-Antworten, Notiz-Widget); rohes HTML wird beim Rendern escaped.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# web-only
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "Window", "Location", "Document", "Element", "NodeList", "HtmlTextAreaElement", "HtmlDocument", "HtmlElement", "HtmlInputElement", "DomRect",
  "Event", "EventTarget", "MouseEvent", "PointerEvent", "KeyboardEvent", "DragEvent", "DataTransfer",
  "DataTransferItem", "DataTransferItemList", "File", "FileList", "Blob", "FormData", "Url",
  "XmlHttpRequest", "XmlHttpRequestUpload", "XmlHttpRequestEventTarget", "ProgressEvent",
  "Request", "RequestInit", "Response", "Headers", "Storage", "Navigator", "Clipboard",
  "MediaQueryList", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition",
] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# server-only
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.8", features = ["multipart"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
futures = { version = "0.3", optional = true }
anyhow = { version = "1", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }

[features]
default = []
web = ["dioxus/web", "dep:gloo-timers", "dep:js-sys", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
server = [
    "dioxus/server",
    "dep:tokio",
    "dep:axum",
    "dep:reqwest",
    "dep:argon2",
    "dep:rand",
    "dep:futures",
    "dep:anyhow",
    "dep:socket2",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
